spring.application.name=buecherverwaltung_backend

spring.datasource.url=${MY_DATABASE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${MY_DB_USER:sa}
spring.datasource.password=${MY_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080

# JWT – in Produktion über Umgebungsvariable JWT_SECRET überschreiben
jwt.secret=${JWT_SECRET:YnVlY2hlci1qd3Qtc2VjcmV0LWtleS0yMDI2LXNlY3VyZSEhISE=}
jwt.expiration=86400000